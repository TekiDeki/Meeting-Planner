:root {
  --bg: #f1eee6;
  --panel: #fffdf9;
  --panel-2: #f8f5ee;
  --line: #e3ded2;
  --line-strong: #cec6b6;
  --ink: #1b2530;
  --ink-soft: #4d5b66;
  --ink-muted: #5e6a74;
  --accent: #17616f;
  --accent-hover: #124f5b;
  --accent-soft: #dceef0;
  --on-accent: #ffffff;
  --ok: #1f7a5c;
  --ok-soft: #e1f2ea;
  --warn: #a8641a;
  --warn-soft: #f8ecd9;
  --bad: #b3261e;
  --bad-soft: #fbe4e1;

  --cell-work-bg: #d7ecdf;
  --cell-work-ink: #17553a;
  --cell-awake-bg: #fbeed2;
  --cell-awake-ink: #7a4a10;
  --cell-night-bg: #eceef0;
  --cell-night-ink: #7c8892;

  --shadow: 0 1px 2px rgba(27, 37, 48, 0.05), 0 12px 30px rgba(27, 37, 48, 0.07);
  --radius: 18px;
  --radius-sm: 11px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}

.theme-dark {
  --bg: #0f1518;
  --panel: #161f23;
  --panel-2: #121a1e;
  --line: #243138;
  --line-strong: #36454d;
  --ink: #e9eff2;
  --ink-soft: #b3c0c7;
  --ink-muted: #81919a;
  --accent: #6cc7d4;
  --accent-hover: #8ad6e0;
  --accent-soft: #14343a;
  --on-accent: #08262b;
  --ok: #5ecfa9;
  --ok-soft: #102e28;
  --warn: #e0a34a;
  --warn-soft: #33270f;
  --bad: #f2978f;
  --bad-soft: #361a18;

  --cell-work-bg: #123a2c;
  --cell-work-ink: #8ee3b8;
  --cell-awake-bg: #38290f;
  --cell-awake-ink: #f0c07a;
  --cell-night-bg: #1a2227;
  --cell-night-ink: #6b7a84;

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 34px rgba(0, 0, 0, 0.28);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--accent); color: var(--on-accent);
  padding: 10px 16px; border-radius: 0 0 10px 0; text-decoration: none;
}
.skip-link:focus { left: 0; }

/* ------------------------------------------------------------------ topbar */

.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(160%) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; min-width: 0; }
.brand-mark { width: 34px; height: 34px; color: var(--accent); flex: none; }
.brand-mark svg { width: 100%; height: 100%; fill: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-text > span:first-child { font-family: var(--serif); font-size: 19px; font-weight: 600; }
.brand-tagline { font-size: 12px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }

.icon-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid transparent; color: var(--ink-soft);
  font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 9px; cursor: pointer;
}
.icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover:not(:disabled) { background: var(--panel); border-color: var(--line); color: var(--ink); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }
.theme-sun { display: none; }
.theme-dark .theme-sun { display: block; }
.theme-dark .theme-moon { display: none; }

select {
  font: inherit; font-size: 14px; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line-strong);
  border-radius: 9px; padding: 7px 9px; cursor: pointer;
}

/* -------------------------------------------------------------------- page */

.wrap { max-width: 1080px; margin: 0 auto; padding: 30px 20px 60px; }

.intro { max-width: 720px; }
.intro h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.12; }
.lede { margin-top: 14px; font-size: 17px; color: var(--ink-soft); max-width: 62ch; }

.claims { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 18px 0 0; }
.claims li {
  font-size: 12.5px; color: var(--ink-soft);
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px;
}
.claims li::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 7px; vertical-align: 1px; }

/* ------------------------------------------------------------------ panels */

.panels {
  display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; margin-top: 26px;
}
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 20px 18px; box-shadow: var(--shadow);
}
.panel h2 { font-size: 21px; }
.panel-sub { font-size: 13px; color: var(--ink-muted); margin-top: 4px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--panel-2); border: 1px solid var(--line-strong);
  border-radius: 999px; padding: 6px 7px 6px 13px; font-size: 14px;
}
.chip:first-child { border-color: var(--accent); background: var(--accent-soft); }
.chip-zone { font-size: 11px; color: var(--ink-muted); font-family: var(--mono); }
.chip-x {
  border: 0; background: transparent; color: var(--ink-muted); cursor: pointer;
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font-size: 15px; line-height: 1; padding: 0;
}
.chip-x:hover { background: var(--bad-soft); color: var(--bad); }

.empty { margin-top: 14px; font-size: 13px; color: var(--ink-muted); }

.addrow { display: flex; gap: 8px; margin-top: 14px; }
.addrow input {
  flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink);
  background: var(--panel-2); border: 1px solid var(--line-strong);
  border-radius: 10px; padding: 10px 12px;
}
.addrow input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

.btn {
  font: inherit; font-size: 14px; cursor: pointer;
  border-radius: 10px; padding: 10px 16px; border: 1px solid var(--line-strong);
  background: var(--panel); color: var(--ink);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
.btn-quiet { background: transparent; }
.btn-sm { padding: 7px 13px; font-size: 13px; }

.msg { font-size: 12.5px; min-height: 18px; margin-top: 9px; color: var(--warn); }
.msg.good { color: var(--ok); }

.dayrow { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
.daylabel { flex: 1; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.daylabel strong { font-size: 16px; font-weight: 600; }
.badge {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 999px; padding: 2px 8px; font-weight: 600;
}
.round-btn {
  width: 34px; height: 34px; flex: none; border-radius: 50%;
  border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink-soft);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.round-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.round-btn:hover { border-color: var(--accent); color: var(--accent); }

.hours { display: flex; align-items: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.hours-label { font-size: 13px; color: var(--ink-soft); margin-right: 2px; }
.dash { color: var(--ink-muted); }
.tiny { font-size: 12px; color: var(--ink-muted); margin-top: 10px; }

/* ------------------------------------------------------------------ result */

.result {
  margin-top: 18px; padding: 20px 22px;
  border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--panel); box-shadow: var(--shadow);
}
.result h2 { font-size: 24px; }
.result p { margin-top: 3px; color: var(--ink-soft); font-size: 15px; }
.result.is-all { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.result.is-all h2 { color: var(--ok); }
.result.is-partial { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); }
.result.is-partial h2 { color: var(--warn); }
.result.is-none { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 32%, var(--line)); }
.result.is-none h2 { color: var(--bad); }
.result.is-all p, .result.is-partial p, .result.is-none p { color: var(--ink); }

/* -------------------------------------------------------------------- grid */

.gridcard {
  margin-top: 18px; scroll-margin-top: 84px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 14px 12px;
}
.grid-scroll {
  overflow: auto; max-height: min(66vh, 620px);
  border-radius: var(--radius-sm); border: 1px solid var(--line);
  overscroll-behavior: contain;
}
.grid {
  border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed;
  font-variant-numeric: tabular-nums;
  /* Columns never squeeze below a readable width: past that the table scrolls
   * sideways inside its own box, which is better than 60px cells. */
  min-width: calc(92px + var(--cols, 3) * 88px);
}

.grid th, .grid td { padding: 0; }

.grid thead th {
  position: sticky; top: 0; z-index: 3;
  background: var(--panel-2); border-bottom: 1px solid var(--line-strong);
  padding: 9px 10px; font-size: 12.5px; font-weight: 600; text-align: center;
  color: var(--ink-soft); white-space: nowrap; vertical-align: bottom;
  overflow: hidden; text-overflow: ellipsis;
}
.grid thead th:first-child { width: 92px; text-align: left; }
.grid thead th .zone { display: block; font-family: var(--mono); font-size: 10px; font-weight: 400; color: var(--ink-muted); margin-top: 2px; }
.grid thead th:first-child { left: 0; z-index: 4; }

.grid tbody th {
  position: sticky; left: 0; z-index: 2;
  background: var(--panel); border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 0; font-family: var(--mono); font-size: 12.5px; font-weight: 500;
  color: var(--ink-soft); text-align: right; white-space: nowrap;
}
.hourbtn {
  display: block; width: 100%; height: 34px; padding: 0 10px;
  background: transparent; border: 0; cursor: pointer;
  font: inherit; font-family: var(--mono); font-size: 12.5px; font-weight: 500;
  color: inherit; text-align: right; white-space: nowrap;
}
.hourbtn:hover { color: var(--accent); }
.hourbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.grid tbody th .nowdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 7px; vertical-align: 1px; }

.grid tbody td { border-bottom: 1px solid var(--line); }
.grid tbody tr:last-child th, .grid tbody tr:last-child td { border-bottom: 0; }

.cell {
  height: 34px; width: 100%; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; gap: 3px;
  font-family: var(--mono); font-size: 13px; cursor: pointer;
  color: var(--cell-night-ink); background: var(--cell-night-bg);
}
.cell.work { background: var(--cell-work-bg); color: var(--cell-work-ink); font-weight: 600; }
.cell.awake { background: var(--cell-awake-bg); color: var(--cell-awake-ink); }
.cell.night { background: var(--cell-night-bg); color: var(--cell-night-ink); }
.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell .daymark { font-size: 9.5px; opacity: 0.85; align-self: flex-start; margin-top: 5px; }

tr.is-picked th { background: var(--accent-soft); color: var(--accent); }
tr.is-picked .cell { box-shadow: inset 0 0 0 2px var(--accent); }
tr.is-now th::after { content: ""; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; padding: 0 3px; }
.key { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); }
.key i { width: 13px; height: 13px; border-radius: 4px; display: inline-block; border: 1px solid var(--line-strong); }
.key-work i { background: var(--cell-work-bg); border-color: color-mix(in srgb, var(--cell-work-ink) 25%, transparent); }
.key-awake i { background: var(--cell-awake-bg); border-color: color-mix(in srgb, var(--cell-awake-ink) 25%, transparent); }
.key-night i { background: var(--cell-night-bg); }
.key-now i { background: var(--accent); border-color: var(--accent); border-radius: 50%; width: 8px; height: 8px; }
.hint { font-size: 12px; color: var(--ink-muted); margin-top: 10px; padding: 0 3px; }

/* ------------------------------------------------------------------ picked */

.picked {
  margin-top: 18px; background: var(--panel); border: 1px solid var(--accent);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px;
}
.picked-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.picked h2 { font-size: 20px; }
.picked-actions { display: flex; gap: 8px; }
.picked-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 1px; background: var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.picked-list li {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  background: var(--panel); padding: 10px 14px;
}
.picked-list .city { font-size: 14px; }
.picked-list .city small { font-family: var(--mono); font-size: 10.5px; color: var(--ink-muted); margin-left: 6px; }
.picked-list .time { font-family: var(--mono); font-size: 15px; font-weight: 600; }
.picked-list .time.is-work { color: var(--ok); }

/* --------------------------------------------------------------------- how */

.how { margin-top: 40px; max-width: 70ch; }
.how h2 { font-size: 22px; }
.how p { margin-top: 11px; color: var(--ink-soft); font-size: 14.5px; }

/* -------------------------------------------------------------------- foot */

.foot { border-top: 1px solid var(--line); padding: 22px 20px 34px; text-align: center; color: var(--ink-muted); font-size: 12.5px; }
.foot p + p { margin-top: 6px; }
.foot a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
.foot a:hover { color: var(--accent); border-color: var(--accent); }

/* ------------------------------------------------------------- responsive */

@media (max-width: 760px) {
  .wrap { padding: 22px 14px 48px; }
  .panels { grid-template-columns: 1fr; }
  .brand-tagline { display: none; }
  .icon-btn span { display: none; }
  .icon-btn { padding: 8px; }
  .grid thead th { padding: 7px 6px; font-size: 11.5px; }
  .grid thead th .zone { display: none; }
  .grid tbody th, .hourbtn { font-size: 11.5px; }
  .hourbtn { padding: 0 7px; height: 38px; }
  .cell { height: 38px; font-size: 12.5px; }
  .result h2 { font-size: 20px; }
  .topbar-inner { padding: 9px 14px; }
}

@media (max-width: 420px) {
  .cell { font-size: 11.5px; }
  .chip-zone { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}



  /* regula casei: tinte de atingere pe mobil */
  @media (pointer: coarse), (max-width: 700px) {
    .chip-x { min-height: 34px; display: inline-flex; align-items: center; }
    a { padding-block: 10px; }
  }
</style>

    var table = LOCALES[state.lang] || LOCALES.en;

      if (fromHash.dateKey) state.dateKey = fromHash.dateKey;
      if (typeof fromHash.workStart === 'number' && fromHash.workStart >= 0) state.workStart = fromHash.workStart;
      if (typeof fromHash.workEnd === 'number' && fromHash.workEnd >= 0) state.workEnd = fromHash.workEnd;
      return;
    }

    var savedCities = null;
    try { savedCities = JSON.parse(stored('cities') || 'null'); } catch (error) { savedCities = null; }
    if (Array.isArray(savedCities) && savedCities.length) {
      state.cities = savedCities.filter(function (city) {
        return city && P.isValidZone(city.zone);
      }).slice(0, MAX_CITIES);
    }
    if (!state.cities.length) {
      state.cities = defaults();
    }

    var savedDate = stored('date');
    if (savedDate && /^\d{4}-\d{2}-\d{2}$/.test(savedDate)) state.dateKey = savedDate;
    var savedFrom = parseInt(stored('from'), 10);
    var savedTo = parseInt(stored('to'), 10);
    if (savedFrom >= 0 && savedFrom < 24) state.workStart = savedFrom;
    if (savedTo >= 0 && savedTo < 24) state.workEnd = savedTo;
  }

  /* Three cities on first load, so the page explains itself before anyone
   * touches it. The local zone always wins the first slot. */
  function defaults() {
    var home = cityForZone(localZone());
    var used = {};
    used[home.zone] = true;
    var list = [home];
    ['Europe/London', 'America/New_York', 'Asia/Tokyo'].forEach(function (zone) {
      if (list.length >= 3 || used[zone] || !P.isValidZone(zone)) return;
      used[zone] = true;
      list.push(cityForZone(zone));
    });
    return list;
  }

  /* -------------------------------------------------------------- render */

  function renderCities() {
    var box = $('cityChips');
    box.textContent = '';
    state.cities.forEach(function (city, index) {
      var chip = document.createElement('span');
      chip.className = 'chip';

      var name = document.createElement('span');
      name.textContent = city.name;
      chip.appendChild(name);

      if (city.zone !== city.name) {
        var zone = document.createElement('span');
        zone.className = 'chip-zone';
        zone.textContent = city.zone;
        chip.appendChild(zone);
      }

      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'chip-x';
      remove.setAttribute('data-index', String(index));
      remove.setAttribute('aria-label', fill('removeCity', { city: city.name }));
      remove.title = fill('removeCity', { city: city.name });
      remove.textContent = '\u00d7';
      chip.appendChild(remove);

      box.appendChild(chip);
    });

    $('cityEmpty').hidden = state.cities.length > 0;
    $('undoBtn').disabled = undoStack.length === 0;
  }

  function renderDate() {
    $('dateLabel').textContent = dayLabel(state.dateKey);
    $('todayBadge').hidden = state.dateKey !== todayKey();
  }

  function renderHours() {
    function options(select, selected) {
      select.textContent = '';
      for (var hour = 0; hour < 24; hour += 1) {
        var option = document.createElement('option');
        option.value = String(hour);
        option.textContent = P.hhmm(hour * 60);
        if (hour === selected) option.selected = true;
        select.appendChild(option);
      }
    }
    options($('workFrom'), state.workStart);
    options($('workTo'), state.workEnd);
  }

  function renderGrid() {
    var head = $('gridHead');
    var body = $('gridBody');
    head.textContent = '';
    body.textContent = '';

    if (!state.cities.length) return;
    $('grid').style.setProperty('--cols', String(state.cities.length));

    var headRow = document.createElement('tr');
    var corner = document.createElement('th');
    corner.setAttribute('scope', 'col');
    corner.textContent = t('gridCorner');
    headRow.appendChild(corner);

    state.cities.forEach(function (city) {
      var th = document.createElement('th');
      th.setAttribute('scope', 'col');
      th.appendChild(document.createTextNode(city.name));
      if (city.zone !== city.name) {
        var zone = document.createElement('span');
        zone.className = 'zone';
        zone.textContent = city.zone;
        th.appendChild(zone);
      }
      headRow.appendChild(th);
    });
    head.appendChild(headRow);

    var home = homeZone();
    var rows = P.rows(home, state.dateKey, Date.now());

    rows.forEach(function (row) {
      var tr = document.createElement('tr');
      if (state.picked === row.index) tr.className = 'is-picked';
      tr.setAttribute('data-row', String(row.index));

      var th = document.createElement('th');
      th.setAttribute('scope', 'row');
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'hourbtn';
      button.setAttribute('data-row', String(row.index));
      button.setAttribute('aria-pressed', state.picked === row.index ? 'true' : 'false');
      button.textContent = row.label;
      th.appendChild(button);
      if (row.isNow) {
        var dot = document.createElement('span');
        dot.className = 'nowdot';
        dot.setAttribute('aria-hidden', 'true');
        th.appendChild(dot);
      }
      tr.appendChild(th);

      state.cities.forEach(function (city) {
        var td = document.createElement('td');
        var cell = document.createElement('div');
        var reading = P.reading(city.zone, row.at, home, state.dateKey);
        cell.className = 'cell ' + P.classify(reading.minutes, state.workStart, state.workEnd);
        cell.textContent = reading.label;
        if (reading.dayOffset !== 0) {
          var mark = document.createElement('span');
          mark.className = 'daymark';
          mark.textContent = (reading.dayOffset > 0 ? '+' : '') + reading.dayOffset;
          cell.appendChild(mark);
        }
        td.appendChild(cell);
        tr.appendChild(td);
      });

      body.appendChild(tr);
    });
  }

  function renderResult() {
    var box = $('result');
    box.className = 'result';

    if (state.cities.length < 2) {
      box.hidden = state.cities.length === 0;
      $('resultTitle').textContent = t('bestAllTitle');
      $('resultBody').textContent = state.cities.length === 1
        ? dayLabel(state.dateKey) + ' · ' + state.cities[0].name
        : '';
      return;
    }
    box.hidden = false;

    var zones = state.cities.map(function (city) { return city.zone; });
    var best = P.overlap(zones, {
      dateKey: state.dateKey,
      homeZone: homeZone(),
      workStart: state.workStart,
      workEnd: state.workEnd
    });

    if (best.kind === 'all') {
      box.classList.add('is-all');
      $('resultTitle').textContent = t('bestAllTitle');
      $('resultBody').textContent = fill('bestAllBody', { start: best.startLabel, end: best.endLabel });
    } else if (best.kind === 'partial') {
      box.classList.add('is-partial');
      $('resultTitle').textContent = t('bestPartialTitle');
      $('resultBody').textContent = fill('bestPartialBody', { count: best.citiesInWork, total: zones.length }) +
        ' ' + fill('bestAllBody', { start: best.startLabel, end: best.endLabel });
    } else {
      box.classList.add('is-none');
      $('resultTitle').textContent = t('bestNoneTitle');
      $('resultBody').textContent = t('bestNoneBody');
    }
  }

  function renderPicked() {
    var box = $('picked');
    if (state.picked === null || !state.cities.length) {
      box.hidden = true;
      return;
    }

    var home = homeZone();
    var rows = P.rows(home, state.dateKey, Date.now());
    var row = rows[state.picked];
    if (!row) { state.picked = null; box.hidden = true; return; }

    box.hidden = false;
    var list = $('pickedList');
    list.textContent = '';

    state.cities.forEach(function (city) {
      var reading = P.reading(city.zone, row.at, home, state.dateKey);
      var li = document.createElement('li');

      var left = document.createElement('span');
      left.className = 'city';
      left.textContent = city.name;
      var small = document.createElement('small');
      small.textContent = reading.dayOffset > 0 ? '+' + reading.dayOffset + 'd'
        : (reading.dayOffset < 0 ? reading.dayOffset + 'd' : '');
      if (small.textContent) left.appendChild(small);

      var right = document.createElement('span');
      right.className = 'time' + (P.classify(reading.minutes, state.workStart, state.workEnd) === P.WORK ? ' is-work' : '');
      right.textContent = reading.label;

      li.appendChild(left);
      li.appendChild(right);
      list.appendChild(li);
    });
  }

  function renderAll() {
    applyLang();
    applyTheme();
    renderCities();
    renderDate();
    renderHours();
    renderResult();
    renderGrid();
    renderPicked();
    $('workFrom').value = String(state.workStart);
    $('workTo').value = String(state.workEnd);
  }

  /* --------------------------------------------------------------- actions */

  function select(hourIndex) {
    state.picked = state.picked === hourIndex ? null : hourIndex;
    renderGrid();
    renderPicked();
  }

  function addCity(raw) {
    var value = String(raw || '').trim();
    if (!value) return;

    var match = C.findByNameOrZone(value);
    if (!match) {
      var candidates = C.search(value, 1);
      if (candidates.length && C.normalise(candidates[0].name).indexOf(C.normalise(value)) === 0) {
        match = candidates[0];
      }
    }

    var zone;
    var name;
    if (match) {
      zone = match.zone;
      name = match.name;
    } else if (P.isValidZone(value)) {
      zone = value;
      name = P.zoneLabel(value);
    } else {
      message(fill('cityUnknown', { query: value }), false);
      return;
    }

    for (var i = 0; i < state.cities.length; i += 1) {
      if (state.cities[i].zone === zone) {
        message(fill('cityDuplicate', { city: name }), false);
        return;
      }
    }
    if (state.cities.length >= MAX_CITIES) {
      message(t('cityLimit'), false);
      return;
    }

    pushUndo();
    state.cities.push({ zone: zone, name: name });
    state.picked = null;
    message('', true);
    save();
    renderAll();
    $('cityInput').value = '';
  }

  function removeCity(index) {
    if (index < 0 || index >= state.cities.length) return;
    pushUndo();
    state.cities.splice(index, 1);
    state.picked = null;
    message('', true);
    save();
    renderAll();
  }

  function undo() {
    if (!undoStack.length) return;
    state.cities = undoStack.pop();
    state.picked = null;
    message('', true);
    save();
    renderAll();
  }

  function message(text, good) {
    var box = $('cityMsg');
    box.textContent = text;
    box.className = 'msg' + (good ? ' good' : '');
  }

  function shiftDay(delta) {
    state.dateKey = P.addDays(state.dateKey, delta);
    state.picked = null;
    save();
    renderAll();
  }

  function copyText() {
    if (state.picked === null) return '';
    var home = homeZone();
    var rows = P.rows(home, state.dateKey, Date.now());
    var row = rows[state.picked];
    if (!row) return '';

    var first = state.cities[0];
    var lines = [fill('shareHeader', {
      day: shortDayLabel(state.dateKey),
      time: row.label,
      city: first ? first.name : P.zoneLabel(home)
    })];

    state.cities.forEach(function (city) {
      var reading = P.reading(city.zone, row.at, home, state.dateKey);
      lines.push(city.name + ': ' + reading.label);
    });
    return lines.join('\n');
  }

  function copyToClipboard() {
    var text = copyText();
    if (!text) return;

    function done() {
      var button = $('copyBtn');
      button.textContent = t('copiedBtn');
      window.setTimeout(function () { button.textContent = t('copyBtn'); }, 1600);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }

    function fallback() {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', 'readonly');
      area.style.position = 'fixed';
      area.style.left = '-9999px';
      document.body.appendChild(area);
      area.select();
      try { document.execCommand('copy'); } catch (error) { /* nothing else to try */ }
      document.body.removeChild(area);
      done();
    }
  }

  /* ----------------------------------------------------------------- boot */

  function boot() {
    state.lang = detectLang();
    state.theme = stored('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    restore();
    if (!state.dateKey) state.dateKey = todayKey();
    if (state.workEnd === state.workStart) state.workEnd = (state.workStart + 9) % 24;

    var list = $('cityList');
    C.list.forEach(function (city) {
      var option = document.createElement('option');
      option.value = city.name;
      option.label = city.zone;
      list.appendChild(option);
    });

    $('cityForm').addEventListener('submit', function (event) {
      event.preventDefault();
      addCity($('cityInput').value);
    });

    $('cityChips').addEventListener('click', function (event) {
      var button = event.target.closest('.chip-x');
      if (!button) return;
      removeCity(parseInt(button.getAttribute('data-index'), 10));
    });

    $('undoBtn').addEventListener('click', undo);
    $('prevDayBtn').addEventListener('click', function () { shiftDay(-1); });
    $('nextDayBtn').addEventListener('click', function () { shiftDay(1); });
    $('todayBtn').addEventListener('click', function () {
      state.dateKey = todayKey();
      state.picked = null;
      save();
      renderAll();
    });

    $('workFrom').addEventListener('change', function () {
      var value = parseInt(this.value, 10);
      state.workStart = value;
      if (state.workEnd === state.workStart) {
        state.workEnd = (value + 9) % 24;
        $('workTo').value = String(state.workEnd);
      }
      state.picked = null;
      save();
      renderAll();
    });

    $('workTo').addEventListener('change', function () {
      var value = parseInt(this.value, 10);
      state.workEnd = value;
      if (state.workEnd === state.workStart) {
        state.workStart = (value + 15) % 24;
        $('workFrom').value = String(state.workStart);
      }
      state.picked = null;
      save();
      renderAll();
    });

    $('gridBody').addEventListener('click', function (event) {
      var target = event.target.closest('[data-row]');
      if (!target) return;
      select(parseInt(target.getAttribute('data-row'), 10));
    });

    $('copyBtn').addEventListener('click', copyToClipboard);
    $('clearBtn').addEventListener('click', function () {
      state.picked = null;
      renderGrid();
      renderPicked();
    });

    $('themeBtn').addEventListener('click', function () {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      store('theme', state.theme);
    });

    $('langSelect').addEventListener('change', function () {
      var value = this.value;
      if (!LOCALES[value]) return;
      state.lang = value;
      store('lang', value);
      renderAll();
    });

    renderAll();
    save();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  window.TD_APP = { state: state, copyText: copyText, addCity: addCity };
}());
</script>

}
